<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff6a00"><title>Rohans Web — Interactive Disco</title>
<style>
:root{--glow:#ff7b00;--glow2:#ffdc32;--ink:#fff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#08040e;color:white;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #ffffff48;background:#1b1024;color:#fff;border-radius:12px;padding:11px 14px;transition:.2s}button:hover{transform:translateY(-2px);border-color:var(--glow);box-shadow:0 0 18px color-mix(in srgb,var(--glow),transparent 40%)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--glow2);outline-offset:3px}.scene{position:fixed;inset:0;background:#10071c url('https://studio.yellowbot.rohansweb.co.uk/asetts/festival/Neon%20Mosaic%20Disco%20Stage.png') center/cover no-repeat;transition:filter .35s;isolation:isolate}.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#08020b35,#09020bd9);z-index:-1}.scene:after{content:"";position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,color-mix(in srgb,var(--glow),transparent 60%),transparent 50%);mix-blend-mode:screen;animation:breath 3s ease-in-out infinite alternate}.scene.paused:after{animation-play-state:paused}.beams{position:absolute;inset:-25%;pointer-events:none;opacity:.5;mix-blend-mode:screen;background:conic-gradient(from 0deg at 50% 20%,transparent 0 8%,#ff7b0045 10%,transparent 17% 29%,#29d9ff45 32%,transparent 40% 58%,#ff32cc45 62%,transparent 70%);filter:blur(12px);animation:spin 18s linear infinite}.scene.paused .beams{animation-play-state:paused}.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:clamp(14px,3vw,34px);gap:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:clamp(14px,2vw,19px);font-weight:900;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 0 18px var(--glow)}.live{font-size:11px;letter-spacing:.15em;border:1px solid #ffffff55;border-radius:100px;padding:8px 12px;background:#13091b99}.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}.eyebrow{font-weight:bold;letter-spacing:.38em;font-size:clamp(10px,1.3vw,14px);color:var(--glow2);text-transform:uppercase}.hero h1{font-size:clamp(42px,10vw,120px);line-height:.9;letter-spacing:-.06em;margin:15px 0;text-transform:uppercase;text-shadow:0 0 8px #fff,0 0 28px var(--glow),0 0 70px var(--glow);max-width:100%;overflow-wrap:anywhere}.hero p{margin:0;color:#f5eaff;letter-spacing:.18em;font-size:clamp(11px,1.5vw,16px)}.visualizer{height:54px;width:min(500px,85vw);display:flex;align-items:center;justify-content:center;gap:4px;margin-top:24px}.visualizer i{width:5px;height:10%;border-radius:9px;background:linear-gradient(0deg,var(--glow),var(--glow2),#fff);box-shadow:0 0 12px var(--glow);animation:bars .7s ease-in-out infinite alternate}.visualizer.still i{animation-play-state:paused;height:8%}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;padding:14px;background:#100817c9;border:1px solid #ffffff25;border-radius:20px;backdrop-filter:blur(18px);box-shadow:0 10px 50px #0006}.control{min-width:0;display:flex;flex-direction:column;gap:7px}.control label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#e3d2f2}.control input[type=range]{width:100%;accent-color:var(--glow)}.control select{width:100%;background:#1b1024;color:white;border:1px solid #ffffff38;border-radius:10px;padding:10px;min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:110px}.primary{background:linear-gradient(110deg,var(--glow),#d92aff);border:0;font-weight:bold}.smallnote{text-align:center;font-size:10px;color:#c6b4d2}.hidden{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes breath{from{opacity:.35;transform:scale(.9)}to{opacity:.95;transform:scale(1.1)}}@keyframes bars{from{height:10%}to{height:100%}}
@media(max-width:620px){.content{padding:12px;gap:8px}.controls{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}.hero h1{font-size:clamp(40px,14vw,76px)}.visualizer{height:36px;margin-top:16px}.top{align-items:flex-start}.actions button{padding:10px 8px;min-width:90px}.smallnote{display:none}}
@media(max-height:580px){.content{gap:7px;padding:12px}.hero h1{font-size:clamp(34px,8vh,70px);margin:8px}.visualizer{height:25px;margin-top:8px}.controls{padding:9px;gap:7px}.control{gap:4px}.control label{font-size:9px}.control select,button{padding:8px}.eyebrow{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style></head>
<body><main class="scene" id="scene"><div class="beams" id="beams"></div><div class="content">
<header class="top"><div class="brand">ROHANS WEB <span style="color:var(--glow2)">/ DISCO</span></div><div class="live" id="status">● DISCO READY</div></header>
<section class="hero"><div class="eyebrow">The floor is yours</div><h1 id="headline">NEON<br>NIGHTS</h1><p id="subline">TURN IT UP · LIGHT IT UP</p><div class="visualizer still" id="visualizer" aria-label="Animated sound bars"></div></section>
<section class="controls" aria-label="Disco controls">
<div class="control"><label for="theme">Light colour</label><select id="theme"><option value="orange">Orange & Gold</option><option value="pink">Hot Pink</option><option value="blue">Electric Blue</option><option value="green">Laser Green</option><option value="rainbow">Rainbow Mix</option></select></div>
<div class="control"><label for="speed">Light movement</label><input id="speed" type="range" min="4" max="32" value="18"><span id="speedVal">18 seconds</span></div>
<div class="control"><label for="brightness">Brightness</label><input id="brightness" type="range" min="35" max="130" value="100"><span id="brightVal">100%</span></div>
<div class="control"><label for="volume">Beat volume</label><input id="volume" type="range" min="0" max="100" value="30"><span id="volumeVal">30%</span></div>
<div class="actions" style="grid-column:span 2"><button class="primary" id="start">Start the disco</button><button id="pause">Pause lights</button></div>
<div class="actions" style="grid-column:span 2"><button id="music">Start beat</button><button id="fullscreen">Full screen</button></div>
<div class="control" style="grid-column:span 2"><label for="titleInput">Your event title</label><input id="titleInput" placeholder="Type your party name" maxlength="32" style="width:100%;background:#1b1024;color:white;border:1px solid #ffffff38;border-radius:10px;padding:10px"></div>
<div class="actions" style="grid-column:span 2"><button id="applyTitle">Update stage title</button><button id="reset">Reset disco</button></div>
</section><div class="smallnote">Tip: Start the beat to create a live electronic rhythm. Use full screen for a party display.</div></div></main>
<script>
(()=>{const $=id=>document.getElementById(id),scene=$('scene'),vis=$('visualizer');let paused=true,audioCtx=null,master=null,beatTimer=null,beatOn=false,step=0,oldTitle='NEON<br>NIGHTS';
for(let i=0;i<48;i++){const b=document.createElement('i');b.style.animationDelay=(Math.random()*.8)+'s';b.style.animationDuration=(.3+Math.random()*.8)+'s';vis.appendChild(b)}
const palettes={orange:['#ff7b00','#ffdc32'],pink:['#ff25c9','#ff87ec'],blue:['#00cfff','#6d5bff'],green:['#70ff00','#c8ff56'],rainbow:['#ff42c8','#43eaff']};
function applyTheme(){const k=$('theme').value,p=palettes[k];document.documentElement.style.setProperty('--glow',p[0]);document.documentElement.style.setProperty('--glow2',p[1]);$('beams').style.background=k==='rainbow'?'conic-gradient(from 0deg at 50% 20%,#ff3e9d77,transparent 15%,#3dfcff77,transparent 35%,#d8ff3877,transparent 55%,#9e53ff77,transparent 75%)':'conic-gradient(from 0deg at 50% 20%,transparent 0 8%,'+p[0]+'66 10%,transparent 17% 29%,'+p[1]+'55 32%,transparent 40% 58%,'+p[0]+'55 62%,transparent 70%)'}
function setPaused(v){paused=v;scene.classList.toggle('paused',paused);vis.classList.toggle('still',paused);$('pause').textContent=paused?'Resume lights':'Pause lights';$('status').textContent=paused?'● LIGHTS PAUSED':'● DISCO LIVE'}
function setSpeed(){let s=Number($('speed').value);$('speedVal').textContent=s+' seconds';document.querySelectorAll('.beams').forEach(e=>e.style.animationDuration=s+'s')}
$('theme').addEventListener('change',applyTheme);$('speed').addEventListener('input',setSpeed);$('brightness').addEventListener('input',()=>{$('brightVal').textContent=$('brightness').value+'%';scene.style.filter='brightness('+(Number($('brightness').value)/100)+')'});$('volume').addEventListener('input',()=>{$('volumeVal').textContent=$('volume').value+'%';if(master)master.gain.value=Number($('volume').value)/100*.22});
$('start').onclick=()=>{setPaused(false);$('status').textContent='● DISCO LIVE';if(!beatOn)startBeat()};
$('pause').onclick=()=>setPaused(!paused);
$('applyTitle').onclick=()=>{let t=$('titleInput').value.trim();if(t){$('headline').textContent=t.toUpperCase();$('subline').textContent='WELCOME TO '+t.toUpperCase()}};
$('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){$('status').textContent='FULL SCREEN UNAVAILABLE'}};
function tone(freq,dur,type='sawtooth',gain=.12){if(!audioCtx||!master)return;const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type=type;osc.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(Math.max(.001,gain*Number($('volume').value)/100),audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);osc.connect(g);g.connect(master);osc.start();osc.stop(audioCtx.currentTime+dur+.03)}
function tick(){if(!audioCtx||paused)return;const bass=[55,55,65.4,49][step%4];tone(bass,.22,'sine',.65);if(step%2===0)tone(1100,.045,'square',.12);if(step%4===2)tone(420,.07,'triangle',.18);step++}
async function startBeat(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();master=master||audioCtx.createGain();master.gain.value=Number($('volume').value)/100*.22;if(!master.isConnected){master.connect(audioCtx.destination)}beatOn=true;$('music').textContent='Stop beat';$('status').textContent='● BEAT PLAYING';if(beatTimer)clearInterval(beatTimer);beatTimer=setInterval(tick,250);paused=false;scene.classList.remove('paused');vis.classList.remove('still');$('pause').textContent='Pause lights'}catch(e){$('status').textContent='AUDIO NOT AVAILABLE'}}
function stopBeat(){if(beatTimer)clearInterval(beatTimer);beatTimer=null;beatOn=false;$('music').textContent='Start beat';$('status').textContent='● DISCO READY'}
$('music').onclick=()=>beatOn?stopBeat():startBeat();
$('reset').onclick=()=>{$('theme').value='orange';$('speed').value=18;$('brightness').value=100;$('volume').value=30;$('titleInput').value='';$('headline').innerHTML=oldTitle;$('subline').textContent='TURN IT UP · LIGHT IT UP';$('brightVal').textContent='100%';$('volumeVal').textContent='30%';applyTheme();setSpeed();scene.style.filter='brightness(1)';setPaused(true);stopBeat()};
applyTheme();setSpeed();setPaused(true);
})();
</script></body></html>
